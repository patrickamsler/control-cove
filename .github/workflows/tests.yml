name: Tests

on:
  pull_request:
  # called by release.yml so the image is only published from a green tree
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            client/package-lock.json
      # client imports @control-cove/shared from its compiled dist/
      - run: npm ci --prefix shared
      - run: npm run build --prefix shared
      - run: npm ci --prefix client
      - run: npm test --prefix client
        env:
          CI: true
          REACT_APP_SERVER_URL: http://localhost:8080

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            server/package-lock.json
      # server imports @control-cove/shared from its compiled dist/
      - run: npm ci --prefix shared
      - run: npm run build --prefix shared
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: npm run test:types --prefix server
