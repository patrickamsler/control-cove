name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    name: Tag and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the version tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tagger needs the full history and existing tags

      # Derives the bump from the conventional-commit messages since the last
      # tag: feat -> minor, fix -> patch, BREAKING CHANGE -> major.
      - name: Create version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch # so every push to main still gets a version
          release_branches: main

      - uses: docker/setup-qemu-action@v3 # arm64 emulation
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # Defined-but-empty means "same origin", which is what this image
          # serves. See the Deployment section of CLAUDE.md.
          build-args: |
            VITE_SERVER_URL=
          tags: |
            patrickamsler/control-cove:${{ steps.tag.outputs.new_version }}
            patrickamsler/control-cove:latest
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.new_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The arm64 leg runs under QEMU; without a cache the whole build is
          # re-run from scratch on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
